name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # No "prefer-lowest" job: resolving goetas-webservices/xsd-reader down to
  # its declared floor (^0.4.7) picks a release whose schema object model
  # PhpConverter's own code isn't compatible with (a GroupRef where an
  # ElementSingle is expected) - a pre-existing mismatch between that floor
  # and this package's actual code, unrelated to PHP version.
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/phpunit
